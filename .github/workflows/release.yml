# Tag v* → linux amd64/arm64 binaries + SHA256SUMS on a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: make lint test build
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/comfynkg-linux-amd64 dist/comfynkg-linux-arm64 dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
