# Tag v* → linux amd64/arm64 binaries + SHA256SUMS on a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: make lint test build
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/comfynkg-linux-amd64 dist/comfynkg-linux-arm64 dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
